name: "Auto Unapprove Reviews"
description: "Dismiss pull request reviews when code owners change files"
author: "step-security"
branding:
  icon: "check-circle"
  color: "green"

inputs:
  github-token:
    description: "GitHub token"
    required: true
  pr-number:
    description: "Pull request number"
    required: true
  dry-run:
    description: "Run in dry-run mode (no actual dismissals)"
    required: false
    default: "true"
  code-owners-file:
    description: "Path to CODEOWNERS file"
    required: false
    default: "CODEOWNERS"
  target-branch:
    description: "Target branch"
    required: false
    default: "main"
  team-start-with:
    description: "Team start with"
    required: false
    default: "@your-org/"

runs:
  using: "composite"
  steps:
    - name: Run Auto Unapprove
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ inputs.pr-number }}
        DRY_RUN: ${{ inputs.dry-run }}
        CODEOWNERS_FILE: ${{ inputs.code-owners-file }}
        TARGET_BRANCH: ${{ inputs.target-branch }}
        TEAM_START_WITH: ${{ inputs.team-start-with }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: node ${{ github.action_path }}/dist/index.js
