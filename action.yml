name: "Auto Unapprove Reviews"
description: "Dismiss pull request reviews when code owners change files"
author: "step-security"
branding:
  icon: "check-circle"
  color: "green"

inputs:
  github-token:
    description: "GitHub token"
    required: true
  pr-number:
    description: "Pull request number"
    required: true
  dry-run:
    description: "Run in dry-run mode (no actual dismissals)"
    required: false
    default: "true"
  code-owners-file:
    description: "Path to CODEOWNERS file"
    required: false
    default: "CODEOWNERS"
  target-branch:
    description: "Target branch"
    required: false
    default: "main"
  team-start-with:
    description: "Team start with"
    required: false
    default: "@your-org/"

runs:
  using: "node24"
  main: ${{ github.action_path }}/dist/index.js
